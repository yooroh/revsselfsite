<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rev's mound</title>
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Cinzel:wght@400;500;600;700&family=Special+Elite&family=Metamorphous&family=Pirata+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="gate">
  <div class="gate-inner">
    <div class="gate-sub">click to enter</div>
  </div>
</div>

<video id="bg-video" src="assets/video/bg.mp4" poster="assets/images/poster.jpg" autoplay muted loop playsinline preload="auto"></video>
<div id="bg-overlay"></div>

<audio id="track" src="assets/audio/Apollon.mp3" preload="auto"></audio>

<main id="page">

  <div class="osd osd--tl">
    <span class="mark" aria-hidden="true">†</span>
    <span class="handle">@revehentt</span>
  </div>

  <p class="bio">hello, i'm will. my interests are aviation, haunted mound, and larping just about everything.</p>

  <nav class="osd osd--tr socials">
    <a class="social" href="https://github.com/franktunnel" target="_blank" rel="noopener" aria-label="GitHub">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.87-1.54-3.87-1.54-.53-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.64 1.59.24 2.77.12 3.06.74.8 1.19 1.83 1.19 3.09 0 4.43-2.7 5.4-5.27 5.69.42.36.78 1.07.78 2.16 0 1.56-.02 2.81-.02 3.19 0 .31.21.67.8.56A10.51 10.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
      </svg>
      <span class="social-tag">github</span>
    </a>
    <a class="social" href="https://t.me/revehent" target="_blank" rel="noopener" aria-label="Telegram">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path d="M21.94 3.6 18.6 20.3c-.25 1.1-.9 1.37-1.83.85l-5.06-3.73-2.44 2.35c-.27.27-.5.5-1.02.5l.36-5.16 9.39-8.49c.41-.36-.09-.56-.63-.2L6.1 13.02 1.1 11.44c-1.09-.34-1.11-1.09.23-1.62l19.4-7.48c.91-.33 1.7.22 1.21 1.26Z"/>
      </svg>
      <span class="social-tag">telegram</span>
    </a>
    <a class="social" href="https://1033.wtf/rev" target="_blank" rel="noopener" aria-label="1033.wtf">
      <img src="assets/images/crow.png" alt="" class="icon-img">
      <span class="social-tag">1033.wtf</span>
    </a>
    <a class="social" href="https://harm.moe/xans" target="_blank" rel="noopener" aria-label="harm.moe">
      <img src="assets/images/harm.png" alt="" class="icon-img">
      <span class="social-tag">harm.moe</span>
    </a>
  </nav>

  <section class="tape-caption" id="lyric-console">
    <div class="caption-body" id="console-body">
      <div class="idle-view" id="idle-view">
        <div class="idle-dots">
          <span class="idle-dot"></span>
          <span class="idle-dot"></span>
          <span class="idle-dot"></span>
        </div>
      </div>
      <div class="lyrics-view" id="lyrics-view">
        <div class="lyrics-track" id="lyrics-track"></div>
      </div>
    </div>
  </section>

  <div class="osd osd--bl transport">
    <button class="play-btn" id="play-btn" aria-label="Play or pause">
      <svg class="icon-play" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">
        <path d="M8 5v14l11-7Z"/>
      </svg>
      <svg class="icon-pause" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">
        <rect x="6" y="5" width="4" height="14" rx="1.2"/>
        <rect x="14" y="5" width="4" height="14" rx="1.2"/>
      </svg>
    </button>
    <span class="track-tag">apollon — ghost mountain</span>
  </div>

  <div class="osd osd--br">
    <div class="volume-control" id="volume-control">
      <div class="volume-popout">
        <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="65" orient="vertical" aria-label="Volume">
      </div>
      <button class="mute-btn" id="mute-btn" aria-label="Mute">
        <svg class="icon-vol" viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3Zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02ZM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77Z"/>
        </svg>
        <svg class="icon-mute" viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
          <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63Zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71ZM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.8L19.73 21 21 19.73l-9-9L4.27 3ZM12 4 9.91 6.09 12 8.18V4Z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="scrub-strip">
    <input type="range" id="progress" class="progress-bar" min="0" max="100" value="0" step="0.1" aria-label="Seek">
    <span class="player-time" id="player-time">0:00 / 0:00</span>
  </div>

</main>

<script src="script.js"></script>
</body>
</html>
